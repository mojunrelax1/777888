<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>陌君拦截</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: #050505;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", sans-serif;
    color: #ffffff;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  :root { --theme-color: #d4af37; }

  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  /* 介绍卡片 (完全适应小窗口) */
  .intro-card {
    position: relative;
    z-index: 5;
    width: 90%;
    max-width: 320px;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 25px 20px;
    text-align: center;
    opacity: 0;
    transform: scale(0.95) translateY(10px);
    transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .intro-card.show { opacity: 1; transform: scale(1) translateY(0); }

  .intro-item { margin-bottom: 14px; }
  .intro-item:last-child { margin-bottom: 0; }
  
  .intro-label { color: rgba(255,255,255,0.4); font-size: 12px; display: block; margin-bottom: 2px; }
  .intro-val { color: var(--theme-color); font-weight: bold; font-size: 15px; line-height: 1.5; }
  
  .title {
    font-size: 20px; font-weight: 500; letter-spacing: 2px; margin-bottom: 15px;
    color: #fff;
  }

  .avatar {
    width: 60px; height: 60px; margin: 0 auto 15px; border-radius: 50%;
    background: rgba(0,0,0,0.5); border: 1px solid var(--theme-color);
    display: flex; justify-content: center; align-items: center;
    font-size: 24px; color: var(--theme-color); box-shadow: inset 0 0 15px rgba(255,255,255,0.05);
  }

  .channel-tag {
    display: inline-block; font-size: 12px; font-weight: bold; color: var(--theme-color);
    padding: 6px 16px; border-radius: 20px; background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--theme-color); margin-top: 15px;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- 介绍卡片 -->
<div class="intro-card" id="intro-card">
  <div class="avatar">👤</div>
  <div class="title" id="display-name">陌君拦截</div>
  <div style="color: rgba(255,255,255,0.4); font-size: 12px; margin-bottom: 15px;">纯净网络 · 极致体验</div>
  
  <div class="intro-item">
    <span class="intro-label">核心功能</span>
    <span class="intro-val">完美拦截上报下发<br>为您保驾护航</span>
  </div>
  
  <div class="channel-tag">@MOJNBYYDS666</div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W = window.innerWidth;
  let H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;

  let currentColor = '#d4af37'; 

  class Particle {
    constructor(x, y, targetX, targetY) {
      this.startX = Math.random() * W;
      this.startY = Math.random() * H;
      this.x = this.startX;
      this.y = this.startY;
      this.targetX = targetX;
      this.targetY = targetY;
      this.size = Math.random() * 1.5 + 0.5;
      this.progress = 0;
      this.speed = 0.01 + Math.random() * 0.01; // 小窗口里速度稍微快一点
      this.state = 0; 
      this.vx = 0;
      this.vy = 0;
    }

    update() {
      if (this.state === 0) {
        this.progress += this.speed;
        if (this.progress > 1) this.progress = 1;
        let ease = 1 - Math.pow(1 - this.progress, 3);
        this.x = this.startX + (this.targetX - this.startX) * ease;
        this.y = this.startY + (this.targetY - this.startY) * ease;
      } else if (this.state === 1) {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.95;
        this.vy *= 0.95;
      }
    }

    draw() {
      ctx.fillStyle = currentColor;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  let particles = [];
  
  function initParticles() {
    particles = [];
    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d');
    offCanvas.width = W;
    offCanvas.height = H;

    // 小窗口里字体按比例缩小
    let fontSize = W < 400 ? 40 : 60;
    offCtx.font = `bold ${fontSize}px "Times New Roman", "Songti SC", serif`;
    offCtx.fillStyle = 'white';
    offCtx.textAlign = 'center';
    offCtx.textBaseline = 'middle';
    
    // 文字放在偏上位置，给下方卡片留空间
    offCtx.fillText('陌君拦截', W / 2, H / 2 - 30);

    const imgData = offCtx.getImageData(0, 0, W, H).data;
    const step = 3; // 粒子密集一点

    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        const index = (y * W + x) * 4;
        const alpha = imgData[index + 3];
        if (alpha > 128) {
          particles.push(new Particle(x, y, x, y));
        }
      }
    }
  }

  let isAnimating = true;

  function animate() {
    if (!isAnimating) return;
    ctx.clearRect(0, 0, W, H); 

    let allArrived = true;
    particles.forEach(p => {
      p.update();
      p.draw();
      if (p.state === 0 && p.progress < 1) allArrived = false;
    });

    if (allArrived && particles.length > 0) {
      isAnimating = false; 
      setTimeout(() => {
        triggerTransition();
      }, 500);
    }
    requestAnimationFrame(animate);
  }

  function triggerTransition() {
    // 粒子缓缓消散
    particles.forEach(p => {
      p.state = 1;
      let angle = Math.random() * Math.PI * 2;
      let speed = Math.random() * 4 + 1;
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed;
    });

    isAnimating = true;
    animateExplosion();

    // 文字消失后，卡片直接优雅浮现
    document.getElementById('intro-card').classList.add('show');

    setTimeout(() => {
      canvas.style.opacity = '0';
      isAnimating = false;
    }, 1500);
  }

  function animateExplosion() {
    if (!isAnimating) return;
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animateExplosion);
  }

  // 启动
  initParticles();
  animate();
</script>
</body>
</html>
